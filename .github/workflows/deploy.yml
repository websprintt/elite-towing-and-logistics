name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Permisos necesarios para interactuar con la API nativa de GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se acumulen despliegues si haces commits muy seguidos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-on-version: '20'
          cache: 'npm'

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
